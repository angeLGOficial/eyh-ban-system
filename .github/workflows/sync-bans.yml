name: Sincronizar Baneos MySQL

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-bans]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Actualizar datos de baneos
        run: |
          echo '${{ github.event.client_payload.data }}' > bans.json
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bans.json
          git commit -m "Actualización automática de baneos desde el servidor [skip ci]" || exit 0
          git push
